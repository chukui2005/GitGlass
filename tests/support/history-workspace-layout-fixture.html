<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>GitGlass history workspace layout fixture</title>
    <link rel="stylesheet" href="../../src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand"><span>◇</span><h1>GitGlass</h1><span class="topbar-divider"></span><strong>demo-repo-with-a-long-name</strong></div>
        <div class="top-state"><span>⌘ <code>master</code></span><span class="dirty">3 个改动</span></div>
        <div class="top-actions">
          <button type="button" class="top-action" aria-label="命令">⌕<span class="top-action-label">命令</span></button>
          <button type="button" class="top-action" aria-label="工作区">▣<span class="top-action-label">工作区</span></button>
          <button type="button" class="top-action" aria-label="历史审查">◫<span class="top-action-label">历史审查</span></button>
          <button type="button" class="top-action" aria-label="恢复">◎<span class="top-action-label">恢复</span></button>
          <button type="button" class="top-action" aria-label="打开仓库">▱<span class="top-action-label">打开仓库</span></button>
          <button type="button" class="sync-action" aria-label="同步远程状态">↻<span class="top-action-label">同步</span></button>
        </div>
      </header>
      <div class="workspace history-workspace">
        <aside class="status-panel">
          <div class="panel-heading"><h2>历史审查</h2></div>
          <p class="inspector-copy">默认读取最近 80 条；应用筛选后最多返回 200 条。</p>
          <section class="branch-list history-filters"><div class="section-label"><span>历史范围与筛选</span></div><label>本地分支<select><option>当前分支（master）</option></select></label><label>作者<input placeholder="作者名或邮箱" /></label><label>文件路径<input placeholder="当前已跟踪文件" /></label><div class="filter-actions"><button type="button" class="primary-action">应用筛选</button><button type="button" class="secondary-action">重置</button></div></section>
        </aside>
        <div class="panel-splitter" role="separator"><span></span></div>
        <section class="main-panel"><div class="main-toolbar"><div><h2>提交历史</h2><span>选择提交以查看审阅详情</span></div></div><div class="main-content"><div class="history-browser"><div class="history-search">⌕<input value="不存在的提交条件" aria-label="搜索提交历史" /><span class="search-count">共 0 个提交</span></div><div class="commit-list"><div class="history-empty"><p>当前筛选条件下没有匹配的提交。</p><button type="button" class="secondary-action">重置筛选</button></div></div></div></div></section>
        <div class="panel-splitter" role="separator"><span></span></div>
        <aside class="context-panel"><div class="inspector-flow"><h2>选择一个提交</h2><p class="inspector-copy">这是只读审阅，不会切换分支或改写工作区。</p></div></aside>
      </div>
      <section class="command-ledger"><div class="ledger-bar"><button type="button" class="ledger-title">命令账本</button><button type="button" class="ledger-glance">最近：读取远程列表 · 成功</button></div></section>
    </main>
  </body>
</html>
