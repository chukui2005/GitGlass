name: GitGlass CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (test and build)
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      # One test run, not two: `vitest run --coverage` executes the same suite as
      # `npm test`, and running it twice doubled both the wall time and the
      # exposure to the Electron-probe flakes that only show up under load.
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Build application
        run: npm run build

      - name: Build Windows artifacts
        run: npm run dist:win
      - name: Verify release artifacts and updater metadata
        run: npm run verify:release
      # Runs the packaged shell smoke test against the artifacts this job just
      # built: GitGlass.exe (not electron.exe), packaged version, hidden title
      # bar with a visible overlay and no native menu (issues #12/#18).
      - name: Packaged shell smoke test
        run: npx vitest run tests/ui/electron-shell.test.cjs
